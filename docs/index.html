<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>プロフィール | muno</title>
<meta name="description" content="munoの自己紹介ポートフォリオページです。元Software Engineerとしての活動やソーシャルリンクをご覧いただけます。">
<meta property="og:title" content="プロフィール | muno">
<meta property="og:description" content="munoの自己紹介ポートフォリオページです。元Software Engineerとしての活動やソーシャルリンクをご覧いただけます。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nomineko.com/">
<meta name="twitter:card" content="summary">
<style>
:root{
  --bg:#0e0f13;
  --ink:#e8e6e0;
  --dim:#8b8a85;
  --line:#26282f;
  --accent:#d4b483;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;}
body{
  min-height:100%;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  background:
    radial-gradient(1200px 600px at 80% -10%,rgba(212,180,131,.10),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,rgba(120,140,200,.08),transparent 60%),
    var(--bg);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:100%;
  max-width:520px;
  animation:rise .12s cubic-bezier(.16, 1, 0.3, 1) both;
}
.eyebrow{
  font-family:system-ui,sans-serif;
  font-size:11px;
  letter-spacing:.4em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:14px;
  padding-left:2px;
  animation:rise .12s .01s cubic-bezier(.16, 1, 0.3, 1) both;
}
h1{
  font-size:clamp(34px,8vw,52px);
  font-weight:600;
  letter-spacing:.02em;
  line-height:1.15;
  margin-bottom:18px;
  animation:rise .12s .02s cubic-bezier(.16, 1, 0.3, 1) both;
}
h1 .accent{color:var(--accent);}
.bio{
  font-size:15px;
  color:var(--dim);
  min-height:1.8em;
  margin-bottom:36px;
  padding-bottom:28px;
  border-bottom:1px solid var(--line);
  animation:rise .12s .03s cubic-bezier(.16, 1, 0.3, 1) both;
}
nav{display:flex;flex-direction:column;gap:2px;}
.link{
  position:relative;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  text-decoration:none;
  color:var(--ink);
  padding:18px 4px;
  border-bottom:1px solid var(--line);
  font-size:19px;
  letter-spacing:.04em;
  overflow:hidden;
  animation:rise .12s cubic-bezier(.16, 1, 0.3, 1) both;
}
.link:nth-child(1){animation-delay:.04s;}
.link:nth-child(2){animation-delay:.05s;}
.link:nth-child(3){animation-delay:.06s;}
.link:nth-child(4){animation-delay:.07s;}
.link:nth-child(5){animation-delay:.08s;}
.link:nth-child(6){animation-delay:.09s;}
.link::before{
  content:"";
  position:absolute;
  left:-4px;right:-4px;bottom:0;
  height:100%;
  background:linear-gradient(90deg,rgba(212,180,131,.10),transparent);
  transform:translateX(-101%);
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
  z-index:-1;
}
.link:hover::before,.link:focus-visible::before{transform:translateX(0);}
.link .name{transition:transform .35s cubic-bezier(.2,.8,.2,1);}
.link:hover .name,.link:focus-visible .name{transform:translateX(10px);}
.link .handle{
  font-family:system-ui,sans-serif;
  font-size:12px;
  letter-spacing:.08em;
  color:var(--dim);
  transition:color .35s,transform .35s;
}
.link:hover .handle,.link:focus-visible .handle{color:var(--accent);transform:translateX(-4px);}
.link:focus-visible{outline:none;}

@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">Profile</div>
  <h1><span class="accent">muno</span></h1>
  <p class="bio">元Software Engineer</p>
  <nav>
    <a class="link" href="./works/" id="link-works">
      <span class="name">Works</span><span class="handle">作ったもの</span>
    </a>
    <a class="link" href="https://x.com/__23rdsf" id="link-x">
      <span class="name">X</span><span class="handle">@__23rdsf</span>
    </a>
    <a class="link" href="https://note.com/mno444" id="link-note">
      <span class="name">note</span><span class="handle">mno444</span>
    </a>
    <a class="link" href="https://bookmeter.com/users/1021053" id="link-bookmeter">
      <span class="name">読書メーター</span><span class="handle">bookmeter</span>
    </a>
    <a class="link" href="https://github.com/psyaro" id="link-github">
      <span class="name">GitHub</span><span class="handle">@psyaro</span>
    </a>
    <a class="link" href="./others/" id="link-others">
      <span class="name">その他</span><span class="handle"></span>
    </a>
  </nav>

</main>
</body>
</html>
