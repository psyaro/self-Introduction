<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>プロフィール | muno</title>
<meta name="description" content="munoの自己紹介ポートフォリオページです。元Software Engineerとしての活動やソーシャルリンクをご覧いただけます。">
<style>
:root{
  --bg:#0e0f13;
  --ink:#e8e6e0;
  --dim:#8b8a85;
  --line:#26282f;
  --accent:#d4b483;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;}
body{
  min-height:100%;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  background:
    radial-gradient(1200px 600px at 80% -10%,rgba(212,180,131,.10),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,rgba(120,140,200,.08),transparent 60%),
    var(--bg);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:100%;
  max-width:520px;
  animation:rise .12s cubic-bezier(.16, 1, 0.3, 1) both;
}
.eyebrow{
  font-family:system-ui,sans-serif;
  font-size:11px;
  letter-spacing:.4em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:14px;
  padding-left:2px;
  animation:rise .12s .01s cubic-bezier(.16, 1, 0.3, 1) both;
}
h1{
  font-size:clamp(34px,8vw,52px);
  font-weight:600;
  letter-spacing:.02em;
  line-height:1.15;
  margin-bottom:18px;
  animation:rise .12s .02s cubic-bezier(.16, 1, 0.3, 1) both;
}
h1 .accent{color:var(--accent);}
.bio{
  font-size:15px;
  color:var(--dim);
  min-height:1.8em;
  margin-bottom:36px;
  padding-bottom:28px;
  border-bottom:1px solid var(--line);
  animation:rise .12s .03s cubic-bezier(.16, 1, 0.3, 1) both;
}
nav{display:flex;flex-direction:column;gap:2px;}
.link{
  position:relative;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  text-decoration:none;
  color:var(--ink);
  padding:18px 4px;
  border-bottom:1px solid var(--line);
  font-size:19px;
  letter-spacing:.04em;
  overflow:hidden;
  animation:rise .12s cubic-bezier(.16, 1, 0.3, 1) both;
}
.link:nth-child(1){animation-delay:.04s;}
.link:nth-child(2){animation-delay:.05s;}
.link:nth-child(3){animation-delay:.06s;}
.link:nth-child(4){animation-delay:.07s;}
.link::before{
  content:"";
  position:absolute;
  left:-4px;right:-4px;bottom:0;
  height:100%;
  background:linear-gradient(90deg,rgba(212,180,131,.10),transparent);
  transform:translateX(-101%);
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
  z-index:-1;
}
.link:hover::before,.link:focus-visible::before{transform:translateX(0);}
.link .name{transition:transform .35s cubic-bezier(.2,.8,.2,1);}
.link:hover .name,.link:focus-visible .name{transform:translateX(10px);}
.link .handle{
  font-family:system-ui,sans-serif;
  font-size:12px;
  letter-spacing:.08em;
  color:var(--dim);
  transition:color .35s,transform .35s;
}
.link:hover .handle,.link:focus-visible .handle{color:var(--accent);transform:translateX(-4px);}
.link:focus-visible{outline:none;}

/* Heisei Access Counter Styles */
.counter-box{
  margin-top: 32px;
  padding: 16px;
  background: rgba(255, 255, 255, 0.01);
  border: 1px dashed var(--line);
  border-radius: 4px;
  text-align: center;
  animation:rise .12s .08s cubic-bezier(.16, 1, 0.3, 1) both;
}
.counter-title{
  font-size: 11px;
  color: var(--dim);
  margin-bottom: 12px;
  letter-spacing: 0.1em;
  font-family: "MS Gothic", "Courier New", monospace;
}
.counter-title .blink{
  animation: heisei-blink 1s steps(2, start) infinite;
}
@keyframes heisei-blink {
  to { visibility: hidden; }
}
.counter-digits-container{
  display: inline-flex;
  align-items: center;
  gap: 1px;
  background: #050709;
  padding: 4px 6px;
  border-top: 2px solid #26282f;
  border-left: 2px solid #26282f;
  border-bottom: 2px solid #8b8a85;
  border-right: 2px solid #8b8a85;
  border-radius: 2px;
}
.counter-digit{
  font-family: "Courier New", Courier, monospace;
  font-size: 20px;
  font-weight: bold;
  color: #39ff14; /* Cyber Neon Green */
  text-shadow: 0 0 5px rgba(57, 255, 20, 0.7);
  background: #0d1a0d;
  width: 14px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid #1a331a;
  user-select: none;
}
.counter-digit:last-child{
  border-right: none;
}
/* Retro Badges */
.retro-badges-container{
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 28px;
  animation:rise .12s .09s cubic-bezier(.16, 1, 0.3, 1) both;
}
.retro-badge{
  width: 88px;
  height: 31px;
  font-family: "MS Gothic", "Courier New", monospace;
  font-size: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.1;
  font-weight: bold;
  user-select: none;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}
.retro-badge.html5{
  background: #1c150c;
  border-top: 2px solid #d4b483;
  border-left: 2px solid #d4b483;
  border-bottom: 2px solid #4a3c28;
  border-right: 2px solid #4a3c28;
  color: #d4b483;
}
.retro-badge.ie6{
  background: #0f1c30;
  border-top: 2px solid #00c6ff;
  border-left: 2px solid #00c6ff;
  border-bottom: 2px solid #003666;
  border-right: 2px solid #003666;
  color: #00c6ff;
}
.retro-badge.netscape{
  background: #0f1c14;
  border-top: 2px solid #39ff14;
  border-left: 2px solid #39ff14;
  border-bottom: 2px solid #0e3d06;
  border-right: 2px solid #0e3d06;
  color: #39ff14;
}

@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">Profile</div>
  <h1><span class="accent">muno</span></h1>
  <p class="bio">元Software Engineer</p>
  <nav>
    <a class="link" href="https://x.com/__23rdsf" id="link-x">
      <span class="name">X</span><span class="handle">@__23rdsf</span>
    </a>
    <a class="link" href="https://note.com/mno444" id="link-note">
      <span class="name">note</span><span class="handle">mno444</span>
    </a>
    <a class="link" href="https://bookmeter.com/users/1021053" id="link-bookmeter">
      <span class="name">読書メーター</span><span class="handle">bookmeter</span>
    </a>
    <a class="link" href="https://github.com/psyaro" id="link-github">
      <span class="name">GitHub</span><span class="handle">@psyaro</span>
    </a>    
  </nav>

</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const counterDigits = document.getElementById('counter-digits');

  // Helper function to render digits
  function updateCounterDisplay(count) {
    const formatted = String(count).padStart(6, '0');
    counterDigits.innerHTML = '';
    for (let char of formatted) {
      const span = document.createElement('span');
      span.className = 'counter-digit';
      span.textContent = char;
      counterDigits.appendChild(span);
    }
  }

  // Condition 1: Only count visits on the production host (psyaro.github.io)
  const isProduction = window.location.hostname === 'psyaro.github.io';

  // If local environment, do not call API to avoid ERR_BLOCKED_BY_CLIENT (Adblockers)
  // and directly render a mock count so the developer can see it working.
  if (!isProduction) {
    const mockCount = 123; // Test value for local preview
    updateCounterDisplay(mockCount);
    return;
  }

  // Condition 2: Prevent incrementing on duplicate visits from the same device within 24 hours
  const lastVisit = localStorage.getItem('muno_last_visit');
  const now = Date.now();
  const ONE_DAY = 24 * 60 * 60 * 1000; // 24 hours in ms
  const isUnique = !lastVisit || (now - parseInt(lastVisit, 10) > ONE_DAY);

  // Set endpoint: use /up to increment on production for unique visits, otherwise read-only GET
  let apiEndpoint = 'https://api.counterapi.dev/v2/psyaros-team-4205/first-counter-4205';
  
  if (isUnique) {
    apiEndpoint += '/up';
    localStorage.setItem('muno_last_visit', String(now));
  }

  // Asynchronous fetch from CounterAPI
  fetch(apiEndpoint)
    .then(res => {
      if (!res.ok) throw new Error('API error');
      return res.json();
    })
    .then(data => {
      if (data && typeof data.count === 'number') {
        updateCounterDisplay(data.count);
      }
    })
    .catch(err => {
      console.error('Counter fetch error:', err);
      // Fallback: if adblocker blocks the API on production, show 000000 instead of keeping dashes
      updateCounterDisplay(0);
    });

});
</script>
</body>
</html>
